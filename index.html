<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chereography">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
</head>
<body>
<title>Chereography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app shell. Large-title nav bar, one scrolling pane per tab (Calendar / Plan / Insights), bottom tab bar on phones that moves into the nav bar as a pill on wide screens. Wide Calendar tab adds an "Up next" column. Sheets slide up from the bottom (centered cards on wide screens). */
:root{
  --bg:#FFFFFF; --card:#F2F2F7; --sheet:#F2F2F7; --row:#FFFFFF; --thumb:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2); --sep:rgba(60,60,67,.16);
  --label:#1C1C1E; --label-2:#6C6C70; --label-3:#A1A1A6;
  --g1:#EDC6B7; --g2:#D09592; --g3:#B76E79;
  --accent:#B76E79; --accent-text:#A15A65; --accent-soft:rgba(183,110,121,.13); --on-accent:#FFFFFF;
  --c-rehearsal:#B76E79; --c-class:#AF52DE; --c-performance:#FF9500; --c-work:#1FA2B6; --c-personal:#007AFF; --c-busy:#8E8E93;
  --ok:#34C759; --warn:#FF9500; --bad:#FF3B30;
  --bar:rgba(255,255,255,.86); --scrim:rgba(0,0,0,.28); --shadow:0 12px 40px rgba(0,0,0,.14);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --gutL:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1C1E; --card:#2C2C2E; --sheet:#2C2C2E; --row:#3A3A3C; --thumb:#636366;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36); --sep:rgba(84,84,88,.6);
  --label:#F5F5F7; --label-2:#AEAEB2; --label-3:#6E6E73;
  --g1:#F5D6C8; --g2:#E3A89F; --g3:#C98890;
  --accent:#E0A49C; --accent-text:#EBB5AD; --accent-soft:rgba(224,164,156,.17); --on-accent:#2A1517;
  --c-rehearsal:#E0A49C; --c-class:#BF5AF2; --c-performance:#FF9F0A; --c-work:#40C8E0; --c-personal:#0A84FF; --c-busy:#98989D;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A;
  --bar:rgba(28,28,30,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --card:#2C2C2E; --sheet:#2C2C2E; --row:#3A3A3C; --thumb:#636366;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36); --sep:rgba(84,84,88,.6);
  --label:#F5F5F7; --label-2:#AEAEB2; --label-3:#6E6E73;
  --g1:#F5D6C8; --g2:#E3A89F; --g3:#C98890;
  --accent:#E0A49C; --accent-text:#EBB5AD; --accent-soft:rgba(224,164,156,.17); --on-accent:#2A1517;
  --c-rehearsal:#E0A49C; --c-class:#BF5AF2; --c-performance:#FF9F0A; --c-work:#40C8E0; --c-personal:#0A84FF; --c-busy:#98989D;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A;
  --bar:rgba(28,28,30,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
:root{--grad:linear-gradient(135deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);--grad2:linear-gradient(140deg,#CF9195 0%,#B76E79 55%,#9C5562 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grad2:linear-gradient(140deg,#C98890 0%,#A86470 55%,#8A4F5C 100%)}}
:root[data-theme="dark"]{--grad2:linear-gradient(140deg,#C98890 0%,#A86470 55%,#8A4F5C 100%)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--label);font:15px/1.35 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.t-rehearsal{--c:var(--c-rehearsal)} .t-class{--c:var(--c-class)} .t-performance{--c:var(--c-performance)} .t-work{--c:var(--c-work)} .t-personal{--c:var(--c-personal)} .t-busy{--c:var(--c-busy)}
.c-dance{--c:var(--accent)} .c-work{--c:var(--c-work)} .c-other{--c:var(--c-personal)}

/* Shell */
.app{height:100%;display:flex;flex-direction:column;position:relative}
.nav{flex:none;padding:calc(6px + env(safe-area-inset-top,0px)) var(--gutR) 0 var(--gutL);position:relative;z-index:5;background:var(--bg)}
.nav-row{display:flex;align-items:center;gap:8px;height:44px}
.nav-row .grow{flex:1}
.txtbtn{color:var(--accent-text);font-size:17px;padding:8px 2px;white-space:nowrap}
.txtbtn.strong{font-weight:600}
.txtbtn:disabled{color:var(--label-3);cursor:default}
.icbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent-text)}
.icbtn:hover{background:var(--fill)}
.addbtn{width:36px;height:36px;border-radius:50%;background:var(--grad2);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px color-mix(in srgb,var(--g3) 40%,transparent);flex:none;transition:transform .2s var(--ease)}
.addbtn:active{transform:scale(.9)}
.titles{padding:2px 0 10px}
.ltitle{margin:0;font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.12;text-wrap:balance}
.ltitle .yr{color:var(--label-3);font-weight:600}
.lsub{margin:2px 0 0;color:var(--label-2);font-size:15px}
.segc.toptabs{display:none}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 var(--gutR) 28px var(--gutL)}
.tabbar{flex:none;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px var(--gutR) calc(4px + env(safe-area-inset-bottom,0px)) var(--gutL);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--label-3);padding:3px 0 2px}
.tab svg{width:26px;height:24px;transition:transform .2s var(--ease)}
.tab[aria-selected="true"]{color:var(--accent-text)}
.tab:active svg{transform:scale(.88)}
.pane{display:none}
.pane.on{display:block}
.pane.enter .stg{animation:rise .42s var(--ease) both;animation-delay:calc(min(var(--i,0),14) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Segmented control */
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;position:relative}
.segc button{height:30px;border-radius:7px;font-size:13px;font-weight:500;position:relative;z-index:1;color:var(--label)}
.segc button[aria-pressed="true"]{font-weight:600}
.segc .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .32s var(--ease)}

/* Groups & rows */
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 4px 8px}
.ghead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ghead span{color:var(--label-2);font-size:13px;text-align:right}
@media (hover:hover) and (pointer:fine){.touchonly{display:none}}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;text-align:left}
.group>.row+.row::before,.group>.srow+.srow .srow-fg::before,.group>.row+.srow .srow-fg::before,.group>.srow+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-size:16px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.row .s{font-size:13px;color:var(--label-2);overflow-wrap:anywhere}
.row .end{color:var(--label-2);font-size:14px;white-space:nowrap}
.chev{color:var(--label-3);flex:none}
.bar3{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.tcol{width:56px;flex:none;display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.tcol b{font-weight:600;color:var(--label)}
.tcol span{color:var(--label-3)}
.empty{color:var(--label-2);font-size:15px;padding:14px 16px;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.p-tight{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.p-short,.p-late{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.p-any{color:var(--label-2);background:var(--fill)}

/* Swipeable session rows */
.srow{position:relative;overflow:hidden;transition:height .28s var(--ease),opacity .28s}
.srow-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-weight:600;font-size:15px;background:transparent}
.srow[data-dir="r"] .srow-bg{background:var(--ok)}
.srow[data-dir="l"] .srow-bg{background:#8E8E93}
.srow-bg span{opacity:0}
.srow[data-dir="r"] .srow-bg .bl,.srow[data-dir="l"] .srow-bg .br{opacity:1}
.srow-fg{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 16px;background:var(--card);touch-action:pan-y;transition:transform .32s var(--ease)}
.srow.drag .srow-fg{transition:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--label-3);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s,transform .25s var(--ease)}
.check svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.check:hover{border-color:var(--accent)}
.check.on{border-color:transparent;background:var(--grad2);transform:scale(1.1)}
.check.on svg{opacity:1;transform:none}
.srow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.srow .t{font-size:16px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.srow .s{font-size:13px;color:var(--label-2)}
.kick{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.srow.c-work .kick{color:var(--c-work)} .srow.c-other .kick{color:var(--c-personal)}

/* Hero (Plan) */
.hero{position:relative;border-radius:20px;padding:18px;overflow:hidden;color:#fff;background:var(--grad2);display:flex;gap:16px;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 100% 0%,rgba(255,225,210,.32),transparent 60%);pointer-events:none}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;text-shadow:0 1px 2px rgba(80,30,40,.18)}
.hero p{margin:4px 0 0;font-size:14px;opacity:.95}
.banner{border-radius:14px;background:var(--accent-soft);padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.banner p{margin:0;font-size:14px;line-height:1.4}
.banner button{align-self:flex-start;color:var(--accent-text);font-weight:600;font-size:15px}
.dayline{font-size:12px;font-weight:600;color:var(--label-2);padding:12px 16px 2px;text-transform:uppercase;letter-spacing:.03em}

/* Calendar */
.calhead{margin:0 0 12px}
.calhead .segc{max-width:240px}
.swipe-cal{touch-action:pan-y;overflow:hidden}
.calbox{will-change:transform}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:0 -4px 2px}
.dp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px;border-radius:12px}
.dp:active{background:var(--fill)}
.dp .dw{font-size:11px;font-weight:600;color:var(--label-3)}
.dp .dn{font-size:19px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.dp.today .dn{background:var(--grad2);color:#fff}
.dp.today .dw{color:var(--accent-text)}
.dp .load{width:26px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;display:flex}
.dp .load i{display:block;height:100%}
.dp .load .b{background:var(--label-3)} .dp .load .p{background:var(--accent)}
.wday{scroll-margin-top:8px}
.wday .dh{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.wday .dh b{font-size:17px;font-weight:700}
.wday .dh span{font-size:13px;color:var(--label-2)}
.wday.today .dh b{color:var(--accent-text)}
.sessrow .bar3{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.sessrow .s{color:var(--accent-text)}
.sessrow.c-work .s{color:var(--c-work)}

/* Week grid (wide) */
.wk{display:none}
.wkg{display:flex;flex-direction:column;height:100%;background:var(--bg);border-radius:12px;border:.5px solid var(--sep);overflow:hidden}
.wk-r{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr))}
.wk-h{border-bottom:.5px solid var(--sep)}
.wk-dh{padding:8px;display:flex;align-items:center;gap:6px;border-left:.5px solid var(--sep)}
.wk-dh .dw{font-size:12px;font-weight:600;color:var(--label-2)}
.wk-dh .dn{font-size:18px;font-weight:600;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;border-radius:14px}
.wk-dh.today .dn{background:var(--grad2);color:#fff}
.wk-dh.today .dw{color:var(--accent-text)}
.wk-a{border-bottom:.5px solid var(--sep)}
.wk-a .lab{font-size:11px;color:var(--label-3);padding:5px 8px 0 0;text-align:right}
.wk-ac{border-left:.5px solid var(--sep);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:26px}
.wk-b{flex:1;min-height:0;display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));position:relative}
.wk-ax{position:relative}
.wk-ax span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--label-3);white-space:nowrap}
.wk-ax span:first-child{transform:none}
.wk-c{position:relative;border-left:.5px solid var(--sep);background-image:linear-gradient(to bottom,var(--sep) 0 .5px,transparent .5px);background-size:100% calc(100% / var(--hours))}
.wk-c.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;left:calc(var(--l) * 1% + 2px);width:calc(var(--w) * 1% - 4px);top:calc(var(--t) * 1%);height:calc(var(--h) * 1% - 2px);min-height:18px;border-radius:5px;padding:3px 6px 3px 7px;overflow:hidden;font-size:12px;line-height:1.25;text-align:left;z-index:2;
  background:color-mix(in srgb,var(--c) 20%,var(--bg));border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 42%,var(--label));transition:box-shadow .2s}
.blk:hover{z-index:6;box-shadow:var(--shadow)}
.blk b{display:block;font-weight:600;overflow-wrap:anywhere}

.blk .tm{display:block;opacity:.85;font-size:11px}
.blk.free{background:var(--bg);border:1px dotted var(--c);border-left:3px solid var(--c)}
.blk.sess{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 17%,transparent) 0 5px,transparent 5px 10px),var(--bg);border:1.5px dashed var(--c)}
.blk.sess .kick{font-size:9.5px;display:block;color:inherit;opacity:.85}
.chipev{display:block;width:100%;text-align:left;font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,var(--bg));color:color-mix(in srgb,var(--c) 42%,var(--label));overflow-wrap:anywhere}

/* Month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-dw{font-size:11px;font-weight:600;color:var(--label-3);text-align:center;padding:0 0 6px}
.mo-c{min-height:56px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:.5px solid var(--sep);min-width:0;cursor:pointer}
.mo-n{font-size:17px;font-weight:500;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:background .2s}
.mo-c.out .mo-n{color:var(--label-3)}
.mo-c.today .mo-n{color:var(--accent-text);font-weight:700}
.mo-c.sel .mo-n{background:var(--label);color:var(--bg);font-weight:700}
.mo-c.sel.today .mo-n{background:var(--grad2);color:#fff}
.mo-bars{display:flex;flex-direction:column;gap:2px;width:72%}
.mo-bars i{display:block;height:3px;border-radius:2px;background:var(--c)}
.mo-bars i.s{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 6px)}
.mo-more{font-size:10px;color:var(--label-3);line-height:1}
.mo-list{display:none}
.mo-it{display:none}

/* Insights */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:13px;color:var(--label-2);font-weight:500}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .v small{font-size:15px;font-weight:600;color:var(--label-2);margin-left:3px}
.tile .n{font-size:12.5px;color:var(--label-2)}
.ringcard{background:var(--card);border-radius:18px;padding:18px;display:flex;align-items:center;gap:18px}
.ringcard h3{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ringcard p{margin:0;color:var(--label-2);font-size:14px}
.ring circle{fill:none}
.ring .trk{stroke:var(--fill-2)}
.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease);transform:rotate(-90deg);transform-origin:50% 50%}
.hero .ring .trk{stroke:rgba(255,255,255,.35)} .hero .ring .val{stroke:#fff}
.ringwrap{position:relative;flex:none}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring-center b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.ring-center small{display:block;font-size:11px;opacity:.8;font-weight:600}
.chart{background:var(--card);border-radius:14px;padding:14px 14px 12px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.bcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px;min-width:0}
.bseg{border-radius:4px;transform-origin:bottom;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.bseg.b{background:var(--fill-2)} .bseg.p{background:var(--grad)} .bseg.d{background:var(--ok)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.blabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px;text-align:center;font-size:11px;color:var(--label-2);font-weight:600}
.blabels .td{color:var(--accent-text)}

<script>
/* Sync: index.html loads config.js, which sets window.CHEREOGRAPHY_FIREBASE.
   Without it the app keeps everything on this device. */
const FIREBASE_CONFIG = (typeof window!=='undefined' && window.CHEREOGRAPHY_FIREBASE) || null;

/*CORE-START*/
const MIN=60000, DAY=86400000;
const DEFAULTS={dayStart:'08:00',dayEnd:'22:30',buffer:30,minSession:30,practiceAt:'18:00',horizonDays:14,theme:'system'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hmStr=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localStr=d=>`${ymd(d)}T${hmStr(d)}`;
const parseYMD=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const parseLocal=s=>{if(!s)return null;const[a,b='00:00']=String(s).split('T');const d=parseYMD(a);const[h,mi]=b.split(':').map(Number);d.setHours(h||0,mi||0,0,0);return d};
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const setHM=(d,h,m)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
const setMin=(d,mins)=>setHM(d,Math.floor(mins/60),mins%60);
const toMin=s=>{const[h,m]=String(s).split(':').map(Number);return (h||0)*60+(m||0)};
const startOfWeek=d=>{const s=startOfDay(d);return addDays(s,-((s.getDay()+6)%7))};
const ceilTo=(d,m)=>new Date(Math.ceil(d.getTime()/(m*MIN))*m*MIN);
const remainingOf=t=>Math.max(0,(t.minutes||0)-(t.done||0));

function occurrences(state,from,to){
  const out=[],F=from.getTime(),T=to.getTime();
  for(const ev of state.events){
    let s,e;
    if(ev.allDay){s=parseYMD(ev.start);e=addDays(parseYMD(ev.end||ev.start),1)}
    else{s=parseLocal(ev.start);e=parseLocal(ev.end)}
    if(!s||isNaN(s))continue;
    if(!e||isNaN(e)||e<=s)e=new Date(s.getTime()+30*MIN);
    const dur=e-s;
    if(ev.repeat==='weekly'){
      const until=ev.until?addDays(parseYMD(ev.until),1).getTime():Infinity;
      let k=Math.max(0,Math.floor((F-dur-s.getTime())/(7*DAY)));
      for(let i=0;i<800;i++,k++){
        const os=addDays(s,7*k),ot=os.getTime();
        if(ot>=T||ot>=until)break;
        const oe=new Date(ot+dur);
        if(oe.getTime()>F)out.push({ev,start:os,end:oe});
      }
    }else if(e.getTime()>F&&s.getTime()<T)out.push({ev,start:s,end:e});
  }
  return out;
}
function deadlineOf(state,t){
  if(t.dueType==='date'&&t.due)return parseLocal(t.due);
  if(t.dueType==='event'&&t.eventId){const ev=state.events.find(e=>e.id===t.eventId);if(!ev)return null;return ev.allDay?parseYMD(ev.start):parseLocal(ev.start)}
  return null;
}
/* Learns when she actually practises from the sessions she ticks off. */
function learnedPracticeAt(state){
  const xs=(state.log||[]).filter(l=>l.cat==='dance'&&l.start&&!l.example).slice(-30).map(l=>{const d=new Date(l.start);return d.getHours()*60+d.getMinutes()}).sort((a,b)=>a-b);
  if(xs.length<3)return null;
  return Math.round(xs[Math.floor(xs.length/2)]/15)*15;
}
/* Smart guesses so she never has to fill in practice settings. */
function guessType(title){const t=String(title).toLowerCase();
  if(/trip|\baway\b|flight|travel|holiday|vacation|out of town|wedding|retreat|\bcamp\b/.test(t))return'busy';
  if(/rehears|run[- ]?through|\bdress\b|\btech\b|spacing|cleaning|blocking/.test(t))return'rehearsal';
  if(/\bshows?\b|perform|recital|showcase|concert|\bgig\b|competition|\bcomp\b|audition|festival|eisteddfod|\bexam\b/.test(t))return'performance';
  if(/class|lesson|workshop|masterclass|teach|coaching|training|bootcamp/.test(t))return'class';
  if(/shift|\bwork\b|meeting|client|office|\bcall\b|interview|admin|lecture|tutorial/.test(t))return'work';
  if(/trip|\baway\b|flight|travel|holiday|vacation|out of town|wedding|retreat|\bcamp\b/.test(t))return'busy';
  return'personal';}
function guessCat(title){return /practi[sc]e|choreo|combo|routine|drill|stretch|danc|rehears|\blearn|warm[- ]?up|conditioning|technique|across the floor|turns|jumps|solo|duet|piece/i.test(title)?'dance':'work'}
function autoPrep(type,title){const t=String(title||'').toLowerCase();
  if(type==='rehearsal')return /dress|tech|spacing|run[- ]?through|cleaning|blocking/.test(t)?90:120;
  if(type==='performance')return /competition|\bcomp\b|audition|eisteddfod|\bexam\b/.test(t)?300:240;
  return 0;}
const sessFor=total=>total<=90?45:60;
const DEFAULT_LEN={rehearsal:120,performance:120,class:90,work:60,busy:240,personal:60};

function buildPlan(state,now){
  const S={...DEFAULTS,...state.settings};
  const Q=15*MIN;
  const t0=ceilTo(now,15),T0=t0.getTime();
  const learned=learnedPracticeAt(state);
  const practiceMin=learned??toMin(S.practiceAt);
  const tasks=state.tasks.filter(t=>!t.completed&&remainingOf(t)>0);
  const dlOf=new Map();
  let H=addDays(startOfDay(t0),S.horizonDays+1).getTime();
  for(const t of tasks){const d=deadlineOf(state,t);dlOf.set(t.id,d?d.getTime():null);if(d&&d.getTime()>H)H=d.getTime()}
  H=Math.min(H,addDays(startOfDay(t0),92).getTime());
  const busy=[],raw=[];
  for(const o of occurrences(state,addDays(startOfDay(t0),-1),new Date(H))){
    if(o.ev.busy===false)continue;
    const b=o.ev.allDay?0:S.buffer*MIN;

  for(const it of items){const s=it.start.getTime(),e=it.end.getTime();if(e<=ds||s>=de)continue;
    if(it.allDay){all.push({it});continue}
    timed.push({it,s:Math.max(s,ds),e:Math.min(e,de),cont:s<ds,contEnd:e>de,sMin:(Math.max(s,ds)-ds)/MIN,eMin:(Math.min(e,de)-ds)/MIN})}
  timed.sort((a,b)=>a.s-b.s||b.e-a.e);return{all,timed};
}
function pieceTime(p){if(!p.s||(p.cont&&p.contEnd))return'All day';if(p.cont)return'until '+fmtTime(new Date(p.e));if(p.contEnd)return'from '+fmtTime(new Date(p.s));return fmtRange(new Date(p.s),new Date(p.e))}
function tcol(p){if(!p.s||(p.cont&&p.contEnd))return`<div class="tcol"><b>all-day</b></div>`;if(p.cont)return`<div class="tcol"><span>until</span><b>${fmtTime(new Date(p.e))}</b></div>`;return`<div class="tcol"><b>${fmtTime(new Date(p.s))}</b><span>${p.contEnd?'→':fmtTime(new Date(p.e))}</span></div>`}
function agendaRow(p,i){const it=p.it;
  return `<button class="row stg ${it.cls}${it.kind==='sess'?' sessrow':''}" style="--i:${i||0}" data-open="${it.open}">${tcol(p)}<span class="bar3"></span><span class="main"><span class="t">${esc(it.kind==='sess'?shortTitle(it.title):it.title)}</span><span class="s">${esc(it.sub)}</span></span></button>`}

/* ---------- calendar ---------- */
function weekPhone(days,per){

  const today=ymd(new Date());
  let h=`<div class="wl"><div class="strip">`;
  days.forEach((d,i)=>{let b=0,p=0;for(const x of per[i].timed){const m=x.eMin-x.sMin;if(x.it.kind==='sess')p+=m;else if(!x.it.cls.includes('free'))b+=m}
    for(const x of per[i].all)if(!x.it.cls.includes('free'))b+=span;
    const bp=Math.min(100,b/span*100),pp=Math.min(100-bp,p/span*100);
    h+=`<button class="dp${ymd(d)===today?' today':''}" data-jump="${ymd(d)}" aria-label="${fmtDay(d)}"><span class="dw">${DOW[d.getDay()][0]}</span><span class="dn">${d.getDate()}</span><span class="load"><i class="b" style="width:${bp}%"></i><i class="p" style="width:${pp}%"></i></span></button>`});
  h+=`</div>`;

    h+=`<div class="wday${isT?' today':''}" id="wd-${ymd(d)}"><div class="dh"><b>${isT?'Today':DOWL[d.getDay()]}</b><span>${d.getDate()} ${MON[d.getMonth()]}</span></div><div class="group">${rows.join('')||`<p class="empty">Free all day</p>`}</div></div>`});
  return h+`</div>`;
}
function weekGrid(days,per){
  const S={...DEFAULTS,...state.settings};const today=ymd(new Date());
  let rs=Math.floor(toMin(S.dayStart)/60)*60,re=Math.min(1440,Math.ceil(toMin(S.dayEnd)/60)*60);
  for(const p of per)for(const x of p.timed)if(!x.cont&&!x.contEnd){rs=Math.min(rs,Math.floor(x.sMin/60)*60);re=Math.max(re,Math.ceil(x.eMin/60)*60)}
  const span=re-rs;
  let h=`<div class="wk"><div class="wkg"><div class="wk-r wk-h"><div></div>`;
  days.forEach(d=>{h+=`<div class="wk-dh${ymd(d)===today?' today':''}"><span class="dw">${DOW[d.getDay()]}</span><span class="dn">${d.getDate()}</span></div>`});
  h+=`</div><div class="wk-r wk-a"><div class="lab">all-day</div>`;
  per.forEach(p=>{h+=`<div class="wk-ac">${p.all.map(x=>`<button class="chipev ${x.it.cls}" data-open="${x.it.open}">${esc(x.it.title)}</button>`).join('')}</div>`});
  h+=`</div><div class="wk-b" style="--hours:${span/60}"><div class="wk-ax">`;
  for(let m=rs;m<re;m+=60)h+=`<span style="top:${(m-rs)/span*100}%">${fmtTime(new Date(2000,0,1,Math.floor(m/60)%24))}</span>`;
  h+=`</div>`;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  days.forEach((d,i)=>{
    const isT=ymd(d)===today;
    h+=`<div class="wk-c${isT?' today':''}" data-day="${ymd(d)}" data-rs="${rs}" data-re="${re}">`;
    const ps=per[i].timed.map(x=>({...x,a:Math.max(x.sMin,rs),b:Math.min(x.eMin,re)})).filter(x=>x.b>x.a);
    let cl=[],end=-1;const clusters=[];
    for(const p of ps){if(p.a>=end&&cl.length){clusters.push(cl);cl=[]}cl.push(p);end=Math.max(end,p.b,p.a+20)}
    if(cl.length)clusters.push(cl);
    for(const c of clusters){const lanes=[];for(const p of c){let li=lanes.findIndex(e=>e<=p.a);if(li<0){li=lanes.length;lanes.push(0)}lanes[li]=Math.max(p.b,p.a+20);p.lane=li}c.forEach(p=>p.n=lanes.length)}
    for(const p of ps){const it=p.it,w=100/p.n;
      h+=`<button class="blk ${it.cls}" data-open="${it.open}" style="--t:${(p.a-rs)/span*100};--h:${(p.b-p.a)/span*100};--l:${p.lane*w};--w:${w}" title="${esc(it.title)} · ${esc(pieceTime(p))}">${it.kind==='sess'&&p.b-p.a>75?`<span class="kick">${it.cls.includes('c-dance')?'Practise':'Planned'}</span>`:''}<b>${esc(it.kind==='sess'?shortTitle(it.title):it.title)}</b>${p.b-p.a>40?`<span class="tm">${esc(pieceTime(p))}</span>`:''}</button>`}
    if(isT&&nm>=rs&&nm<=re)h+=`<div class="now" style="top:${(nm-rs)/span*100}%"></div>`;
    h+=`</div>`;
  });
  return h+`</div></div></div>`;
}
function renderWeek(){

/* ---------- plan ---------- */
function ringSVG(size,stroke,pct){const r=(size-stroke)/2,c=2*Math.PI*r;return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-Math.max(0,Math.min(1,pct)))}"/></svg>`}
function animateRings(root){requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('.ring .val').forEach(c=>c.style.strokeDashoffset=c.dataset.off)))}
function sessRow(s,i){
  const t=taskById(s.taskId);if(!t)return'';
  const st=new Date(s.start),en=new Date(s.end);
  const ev=t.dueType==='event'?state.events.find(e=>e.id===t.eventId):null;
  const sub=[fmtRange(st,en),s.count>1?`${s.idx} of ${s.count}`:null,ev?`for ${dayName(evStart(ev))}`:null].filter(Boolean).join(' · ');
  return `<div class="srow stg c-${t.cat}" style="--i:${i||0}" data-task="${t.id}" data-s="${s.start}" data-e="${s.end}"><div class="srow-bg"><span class="bl">Done</span><span class="br">Later</span></div><div class="srow-fg"><button class="check" data-check aria-label="Mark done">${CHECK}</button><button class="main" data-open="task:${t.id}"><span class="kick">${t.cat==='dance'?'Practise':'Work on'}</span><span class="t">${esc(shortTitle(t.title))}</span><span class="s">${esc(sub)}</span></button></div></div>`;
}
function statusPill(t){const inf=plan.info[t.id];if(t.completed||remainingOf(t)<=0)return'<span class="pill p-any">Done</span>';const st=inf?inf.status:'any';return`<span class="pill p-${st}">${{ok:'On track',tight:'Start soon',short:'Short on time',late:'Overdue',any:'Anytime'}[st]}</span>`}
function taskRow(t,i){
  const inf=plan.info[t.id];const done=t.completed||remainingOf(t)<=0;
  const dl=deadlineOf(state,t);const ev=t.dueType==='event'?state.events.find(e=>e.id===t.eventId):null;
  let sub;
  if(done)sub=`${fmtDur(t.minutes)} done`;
  else if(inf&&inf.status==='late')sub=`Deadline passed · ${fmtDur(inf.remaining)} left`;
  else if(inf&&inf.status==='short')sub=`${fmtDur(inf.shortfall)} short before ${dl?fmtDay(dl):'the deadline'}`;
  else if(ev&&dl)sub=`${fmtDur(remainingOf(t))} left · ${ev.title} ${relDay(dl)}`;
  else if(dl)sub=`${fmtDur(remainingOf(t))} left · due ${fmtDay(dl)}`;
  else sub=`${fmtDur(remainingOf(t))} · whenever you're free`;
  const pct=t.minutes?Math.min(1,(t.done||0)/t.minutes):0;
  return `<button class="row stg c-${t.cat}" style="--i:${i||0}" data-open="task:${t.id}"><span class="ringwrap" style="color:var(--c)">${ringSVG(30,4,pct)}</span><span class="main"><span class="t">${esc(t.title)}</span><span class="s">${esc(sub)}</span></span>${statusPill(t)}${CHEV}</button>`;
}
function planHTML(compact){
  const now=new Date(),today=ymd(now);let i=0;
  const todays=plan.sessions.filter(s=>ymd(new Date(s.start))===today);
  const doneToday=(state.log||[]).filter(l=>ymd(new Date(l.at))===today);
  const doneMins=sum(doneToday.map(l=>l.mins)),leftMins=sum(todays.map(s=>(s.end-s.start)/MIN));
  let h='';
  if(!compact&&(state.events.some(e=>e.example)||state.tasks.some(t=>t.example)))
    h+=`<div class="banner stg" style="--i:${i++}"><p><b>This is an example week.</b> Tap + and type something like "Rehearsal Mon 7–10pm". Practice gets planned for you.</p><button data-act="clearEx">Clear examples and start</button></div>`;
  if(!compact){
    const next=todays[0];let head,sub;
    if(next){const t=taskById(next.taskId);head=(t.cat==='dance'?'Practise ':'')+shortTitle(t.title);sub=`${inMins(next.start)[0].toUpperCase()+inMins(next.start).slice(1)} · ${fmtRange(new Date(next.start),new Date(next.end))}`}
    else if(doneMins){head='All done for today';sub=`${fmtDur(doneMins)} logged. Nice work.`}
    else{const up=plan.sessions[0];head='Nothing planned today';sub=up?`Next: ${dayName(new Date(up.start))}, ${fmtTime(new Date(up.start))}`:'Add a rehearsal and practice gets planned'}
    const tot=doneMins+leftMins,pct=tot?doneMins/tot:0;
    h+=`<div class="hero stg" style="--i:${i++}"><span class="ringwrap">${ringSVG(76,8,pct)}<span class="ring-center"><span><b>${fmtHrs(doneMins)}</b><small>of ${fmtHrs(tot)}h</small></span></span></span><div class="txt"><h3>${esc(head)}</h3><p>${esc(sub)}</p></div></div>`;
  }
  const sod=startOfDay(now),eod=addDays(sod,1);
  const items=itemsBetween(sod,eod).filter(x=>x.end>now||x.allDay).sort((a,b)=>a.start-b.start);
  const rows=items.map(x=>x.kind==='sess'?sessRow(x.s,i++):agendaRow(x.allDay?{it:x}:{it:x,s:Math.max(x.start.getTime(),sod.getTime()),e:Math.min(x.end.getTime(),eod.getTime()),cont:x.start<sod,contEnd:x.end>eod},i++));
  h+=`<div class="ghead"><h2>${compact?'Today':'Rest of today'}</h2></div><div class="group">${rows.join('')||`<p class="empty">Nothing else today.</p>`}</div>`;
  const active=state.tasks.filter(t=>!t.completed&&remainingOf(t)>0);
  const attn=active.filter(t=>{const s=plan.info[t.id]?.status;return s==='late'||s==='short'});
  if(attn.length)h+=`<div class="ghead"><h2>Needs attention</h2></div><div class="group">${attn.map(t=>taskRow(t,i++)).join('')}</div>`;
  const upto=addDays(sod,compact?4:8).getTime();
  const up=plan.sessions.filter(s=>ymd(new Date(s.start))!==today&&s.start<upto);
  h+=`<div class="ghead"><h2>Coming up</h2><span class="touchonly">swipe right when done</span></div><div class="group">`;
  if(!up.length)h+=`<p class="empty">Nothing planned yet.</p>`;
  let last='';
  for(const s of up){const k=ymd(new Date(s.start));if(k!==last){const dd=new Date(s.start);h+=`<div class="dayline">${dayName(dd)}${dayName(dd)===fmtDay(dd)?'':' · '+fmtDay(dd)}</div>`;last=k}h+=sessRow(s,i++)}
  h+=`</div>`;
  if(!compact){
    const order=t=>{const d=deadlineOf(state,t);return d?d.getTime():Infinity};
    const rest=active.filter(t=>!attn.includes(t)).sort((a,b)=>order(a)-order(b));

    h+=`<div class="ghead"><h2>To-dos</h2><span>${rest.length?rest.length+' open':''}</span></div><div class="group">${rest.map(t=>taskRow(t,i++)).join('')||`<p class="empty">All clear.</p>`}</div>`;
    if(done.length)h+=`<details style="margin-top:14px"><summary class="txtbtn" style="list-style:none;cursor:pointer;font-size:15px;padding-left:4px">Show ${done.length} completed</summary><div class="group" style="margin-top:8px">${done.map(t=>taskRow(t)).join('')}</div></details>`;
  }
  return h;
}

  const planDay=days.map(d=>sum(wkS.filter(s=>ymd(new Date(s.start))===ymd(d)).map(s=>(s.end-s.start)/MIN)));

  const busyTotal=sum(busyDay);
  const freeLeft=sum(plan.free.filter(f=>f.s<W1).map(f=>(Math.min(f.e,W1)-f.s)/MIN));
  const pd=new Set(log.filter(l=>l.cat==='dance').map(l=>ymd(new Date(l.at))));let streak=0,d=startOfDay(now);if(!pd.has(ymd(d)))d=addDays(d,-1);while(pd.has(ymd(d))){streak++;d=addDays(d,-1)}

    <div class="tile stg" style="--i:${i++}"><span class="k">Streak</span><span class="v">${streak}<small>${streak===1?'day':'days'}</small></span><span class="n">of practice in a row</span></div></div>`;
  const max=Math.max(span,...days.map((_,k)=>busyDay[k]+planDay[k]+doneDay[k]));

  const ready=state.tasks.filter(t=>t.auto&&t.dueType==='event').map(t=>({t,d:deadlineOf(state,t)})).filter(x=>x.d&&x.d>now&&x.d<addDays(now,28)).sort((a,b)=>a.d-b.d);

      h+=`<button class="row stg" style="--i:${i++}" data-open="ev:${ev.id}"><span class="main"><span style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="t">${esc(ev.title)}</span><span class="s" style="white-space:nowrap">${relDay(d)}</span></span><span class="prog"><i style="width:${p*100}%"></i></span><span style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px"><span class="s">${fmtDur(t.done||0)} of ${fmtDur(t.minutes)} practised</span>${statusPill(t)}</span></span></button>`});
    h+=`</div>`;
  }
  const notes=[];
  const fut=days.map((dd,k)=>({dd,v:busyDay[k]+planDay[k]})).filter(x=>startOfDay(x.dd)>=startOfDay(now)).sort((a,b)=>b.v-a.v)[0];
  if(fut&&fut.v>=300)notes.push(`${DOWL[fut.dd.getDay()]} is your fullest day left, with ${fmtDur(fut.v)} booked. Practice stays off days with 7+ hours of commitments.`);
  if(plan.learned!=null)notes.push(`You usually practise around ${fmtTime(setMin(now,plan.learned))}, so new sessions go there.`);
  else notes.push(`New practice goes around ${fmtTime(setMin(now,toMin(S.practiceAt)))} for now. Tick sessions off and Chereography learns when you really practise.`);
  const short=state.tasks.filter(t=>plan.info[t.id]?.status==='short');
  if(short.length){const inf=plan.info[short[0].id];notes.push(`${short[0].title} is ${fmtDur(inf.shortfall)} short. Something has to move before ${fmtDay(new Date(inf.deadline))}.`)}

  h+=`<div class="group" style="margin-top:24px"><button class="row" data-act="settings"><span class="main"><span class="t">Settings</span></span><span class="end">${syncLabel()}</span>${CHEV}</button></div>`;
  return h;
}

  let ev=sheetCtx.id&&state.events.find(e=>e.id===sheetCtx.id);
  if(ev){Object.assign(ev,data);delete ev.example}else{ev={id:uid(),...data};state.events.push(ev)}
  const idx=state.tasks.findIndex(t=>t.auto&&t.eventId===ev.id);
  const on=$('fPrep').checked&&repeat!=='weekly',mins=stepVal('fPrepMin');
  if(on){if(idx>=0){Object.assign(state.tasks[idx],{title:'Practise for '+title,minutes:mins,session:sessFor(mins),split:mins>sessFor(mins)});delete state.tasks[idx].example}else state.tasks.push(prepTask(ev,mins))}
  else if(idx>=0)state.tasks.splice(idx,1);
  closeSheet();commit(sheetCtx.id?'Saved':'Event added',snap);
}

/* Task sheet */
function openTask(id,draft){
  const t=id?taskById(id):null;const d=t?{...t}:(draft||{title:'',cat:'work',minutes:60,dueType:'none',due:'',eventId:'',notBefore:'',split:false,session:120,notes:'',done:0});
  const due=d.due?parseLocal(d.due):setHM(addDays(new Date(),2),18,0);
  const now=new Date();
  const evs=state.events.filter(e=>e.repeat!=='weekly').map(e=>({e,dd:evStart(e)})).filter(x=>x.dd&&(x.dd>now||x.e.id===d.eventId)).sort((a,b)=>a.dd-b.dd);
  const inf=t&&plan.info[t.id];
  const booked=inf&&inf.sessions.length?`Booked: ${inf.sessions.slice(0,4).map(s=>`${DOW[new Date(s.start).getDay()]} ${fmtTime(new Date(s.start))}`).join(', ')}${inf.sessions.length>4?'…':''}`:'';
  openSheet('task',head(t?(t.auto?'Practice':'Edit To-do'):'New To-do',t?'Done':'Add')+`<div class="sh-body">
    <div class="fg"><input class="fin" id="tTitle" placeholder="What needs doing" value="${esc(d.title)}" autocomplete="off" aria-label="Title" ${t&&t.auto?'readonly':''}></div>
    ${booked?`<p class="hint" style="margin-top:-8px">${esc(booked)}</p>`:''}
    <div class="fg">
      <div class="fr"><span>Kind</span><select class="fsel" id="tCat" aria-label="Kind">${Object.entries(CAT_LABEL).map(([k,v])=>`<option value="${k}" ${d.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fr"><span>Time needed</span>${stepperHTML('tMin',d.minutes||60,15,2400)}</div>
      ${t?`<div class="fr"><span>Done so far</span>${stepperHTML('tDone',d.done||0,0,d.minutes||60)}</div>`:''}
    </div>
    <div class="fg" ${t&&t.auto?'hidden':''}>
      <div class="fr"><span>Deadline</span><select class="fsel" id="tDue" aria-label="Deadline"><option value="none">None</option><option value="date" ${d.dueType==='date'?'selected':''}>Date</option><option value="event" ${d.dueType==='event'?'selected':''}>Before an Event</option></select></div>
      <div class="fr" id="tDateRow"><span>Due</span><span class="pair"><input class="pill-in" type="date" id="tDD" value="${ymd(due)}" aria-label="Due date"><input class="pill-in" type="time" id="tDT" value="${hmStr(due)}" aria-label="Due time"></span></div>
      <div class="fr" id="tEvRow"><span>Event</span><select class="fsel" id="tEv" aria-label="Event">${evs.map(x=>`<option value="${x.e.id}" ${x.e.id===d.eventId?'selected':''}>${esc(x.e.title)} · ${fmtDay(x.dd)}</option>`).join('')||'<option value="">No upcoming events</option>'}</select></div>
    </div>
    <div class="fg"><div class="fr"><span>Do it in one go</span>${sw('tOne',!d.split)}</div></div>
    <div class="fg"><textarea class="fta" id="tNotes" placeholder="Notes" rows="2" aria-label="Notes">${esc(d.notes||'')}</textarea></div>
    <p class="ferr" id="tErr" hidden></p>
    ${t?`<div class="fg"><button class="fr act" id="tComplete">${t.completed?'Mark as Not Done':'Mark as Done'}</button>${t.auto?'':`<button class="fr danger" id="tDel">Delete To-do</button>`}</div>`:''}
  </div>`,{id:t?t.id:null});
  syncTaskSheet();
}
function syncTaskSheet(){const v=$('tDue').value;$('tDateRow').hidden=v!=='date';$('tEvRow').hidden=v!=='event'}
function saveTask(){
  const er=$('tErr');er.hidden=true;const title=$('tTitle').value.trim();
  if(!title){er.textContent='Say what needs doing.';er.hidden=false;return}
  const dueType=$('tDue').value;
  if(dueType==='event'&&!$('tEv').value){er.textContent='No upcoming event to pick. Add the event first, or choose a date.';er.hidden=false;return}
  const snap=snapshot(),mins=stepVal('tMin'),cat=$('tCat').value,one=$('tOne').checked;
  const data={title,cat,minutes:mins,notes:$('tNotes').value.trim(),split:!one,session:cat==='dance'?sessFor(mins):120};
  let t=sheetCtx.id&&taskById(sheetCtx.id);
  if(!t||!t.auto)Object.assign(data,{dueType,due:dueType==='date'?$('tDD').value+'T'+($('tDT').value||'22:00'):'',eventId:dueType==='event'?$('tEv').value:''});
  if(t){Object.assign(t,data);if($('tDone'))t.done=Math.min(stepVal('tDone'),mins);delete t.example;if(remainingOf(t)>0)t.completed=false}
  else{t={id:uid(),...data,done:0,notBefore:'',completed:false,auto:false,created:Date.now(),skips:[]};state.tasks.push(t)}
  closeSheet();commit(sheetCtx.id?'Saved':'To-do added',snap);
}

/* Settings */
function openSettings(){
  const S={...DEFAULTS,...state.settings};const ex=state.events.some(e=>e.example)||state.tasks.some(t=>t.example);
  const user=mode==='cloud'&&fb&&fb.auth().currentUser;
  openSheet('settings',head('Settings','Done')+`<div class="sh-body">
    <div><p class="cap">Appearance</p><div class="segc" id="sTheme"><span class="thumb"></span><button type="button" data-th="system" aria-pressed="${S.theme==='system'}">System</button><button type="button" data-th="light" aria-pressed="${S.theme==='light'}">Light</button><button type="button" data-th="dark" aria-pressed="${S.theme==='dark'}">Dark</button></div></div>
    <div><p class="cap">Planning</p><div class="fg">
      <div class="fr"><span>Day starts</span><input class="pill-in" type="time" id="sStart" value="${S.dayStart}" aria-label="Day starts"></div>
      <div class="fr"><span>Day ends</span><input class="pill-in" type="time" id="sEnd" value="${S.dayEnd}" aria-label="Day ends"></div>
      <div class="fr"><span>Gap around events</span>${stepperHTML('sBuf',S.buffer,0,120)}</div>
    </div><p class="hint" style="margin-top:8px">Practice and work only go between these hours, with a gap around events for travel and changing.${plan.learned!=null?` Practice time is learned from your sessions: around ${fmtTime(setMin(new Date(),plan.learned))}.`:''}</p></div>
    <div><p class="cap">Account</p><div class="fg">
      <div class="fr"><span style="overflow:hidden;text-overflow:ellipsis">${user?esc(user.email):'This device only'}</span><span style="color:var(--label-2)">${syncLabel()}</span></div>
      ${user?`<button class="fr danger" id="sOut">Sign Out</button>`:''}
    </div></div>
    <div><p class="cap">Backup</p><div class="fg">
      <button class="fr act" id="sCopy">Copy Backup</button>
      <button class="fr act" id="sRestore">Restore a Backup</button>
      ${ex?`<button class="fr danger" id="sClear">Clear Example Items</button>`:''}
    </div><textarea class="fta" id="sPaste" hidden placeholder="Paste your backup here, then tap Restore a Backup again" style="background:var(--row);border-radius:12px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea><p class="ferr" id="sErr" hidden style="margin-top:8px"></p></div>
  </div>`);
  setThumb($('sTheme'));
}
function saveSettings(){
  const a=$('sStart').value,b=$('sEnd').value,er=$('sErr');
  if(!a||!b||toMin(b)-toMin(a)<60){er.textContent='The day needs to end at least an hour after it starts.';er.hidden=false;return}
  state.settings={...state.settings,dayStart:a,dayEnd:b,buffer:stepVal('sBuf')};closeSheet();commit();
}
function bindSheet(kind){
  const sh=$('sheet');
  sh.querySelector('[data-sh="cancel"]').onclick=closeSheet;
  const save=sh.querySelector('[data-sh="save"]');
  if(kind==='quick'){save.onclick=saveQuick;$('qText').addEventListener('input',quickPreview);$('qText').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(sheetCtx.q)saveQuick()}});
    sh.onclick=e=>{const c=e.target.closest('[data-ex]');if(c){$('qText').value=c.dataset.ex;quickPreview();$('qText').focus();return}
      const n=e.target.closest('[data-new]');if(n){const k=n.dataset.new;closeSheet();setTimeout(()=>k==='event'?openEvent(null):openTask(null),320);return}
      if(e.target.closest('[data-qedit]')){const q=sheetCtx.q;closeSheet();setTimeout(()=>q.kind==='event'?openEvent(null,draftFromQuick(q)):openTask(null,draftFromQuick(q)),320)}}}
  else sh.onclick=null;
  if(kind==='event'){save.onclick=saveEvent;['fAll','fRep','fPrep'].forEach(id=>$(id).addEventListener('change',syncEventSheet));
    $('fType').addEventListener('change',()=>{if(!sheetCtx.id){const a=autoPrep($('fType').value,$('fTitle').value);$('fPrep').checked=a>0;if(a)setStep('fPrepMin',a);syncEventSheet()}});
    $('fTitle').addEventListener('change',()=>{if(!sheetCtx.id){const g=guessType($('fTitle').value);if(g!=='personal'){$('fType').value=g;$('fType').dispatchEvent(new Event('change'))}}});
    $('fSD').addEventListener('change',()=>{if($('fED').value<$('fSD').value)$('fED').value=$('fSD').value});
    $('fST').addEventListener('change',()=>{const s=parseLocal($('fSD').value+'T'+$('fST').value),e=parseLocal($('fED').value+'T'+$('fET').value);if(s&&e&&e<=s){const n=new Date(s.getTime()+60*MIN);$('fED').value=ymd(n);$('fET').value=hmStr(n)}});
    if($('fDel'))$('fDel').onclick=()=>arm($('fDel'),'Delete Event',()=>{const snap=snapshot();state.events=state.events.filter(x=>x.id!==sheetCtx.id);state.tasks=state.tasks.filter(t=>!(t.auto&&t.eventId===sheetCtx.id));closeSheet();commit('Event deleted',snap)})}
  if(kind==='task'){save.onclick=saveTask;$('tDue').addEventListener('change',syncTaskSheet);
    $('tMin').addEventListener('change',()=>{const d=$('tDone');if(d){d.dataset.max=stepVal('tMin');if(stepVal('tDone')>stepVal('tMin'))setStep('tDone',stepVal('tMin'))}});
    if($('tComplete'))$('tComplete').onclick=()=>{const t=taskById(sheetCtx.id);if(!t)return;const snap=snapshot();
      if(!t.completed){const left=remainingOf(t);if(left>0)state.log.push({id:uid(),taskId:t.id,title:t.title,cat:t.cat,mins:left,at:Date.now(),start:Date.now()-left*MIN});t.done=t.minutes;t.completed=true}
      else{t.completed=false;if(remainingOf(t)<=0)t.done=0}
      closeSheet();commit(t.completed?'Marked as done':'Back on your list',snap)};
    if($('tDel'))$('tDel').onclick=()=>arm($('tDel'),'Delete To-do',()=>{const snap=snapshot();state.tasks=state.tasks.filter(x=>x.id!==sheetCtx.id);closeSheet();commit('To-do deleted',snap)})}
  if(kind==='settings'){save.onclick=saveSettings;
    $('sTheme').addEventListener('click',e=>{const b=e.target.closest('[data-th]');if(!b)return;state.settings.theme=b.dataset.th;$('sTheme').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));setThumb($('sTheme'));applyTheme();persist()});
    if($('sOut'))$('sOut').onclick=()=>{closeSheet();fb.auth().signOut()};
    $('sCopy').onclick=async()=>{const txt=JSON.stringify({app:'chereography',exported:new Date().toISOString(),...state});try{await navigator.clipboard.writeText(txt);toast('Backup copied. Paste it into Notes to keep it safe.')}catch(e){$('sPaste').hidden=false;$('sPaste').value=txt;$('sPaste').select();toast('Select all and copy the text in the box')}};
    $('sRestore').onclick=()=>{const p=$('sPaste');if(p.hidden||!p.value.trim()){p.hidden=false;p.value='';p.focus();return}
      try{const d=JSON.parse(p.value);if(!d||!Array.isArray(d.events)||!Array.isArray(d.tasks))throw 0;const snap=snapshot();state=normalize(d);closeSheet();commit('Backup restored',snap)}catch(x){$('sErr').textContent="That isn't a Chereography backup. Paste the whole text you copied.";$('sErr').hidden=false}};
    if($('sClear'))$('sClear').onclick=()=>{closeSheet();clearExamples()}}
}
function arm(btn,label,fn){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');btn.textContent='Tap Again to Delete';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=label}},3500)}
function clearExamples(){const snap=snapshot();state.events=state.events.filter(e=>!e.example);state.tasks=state.tasks.filter(t=>!t.example);state.log=state.log.filter(l=>!l.example);commit('Examples cleared',snap)}

/* ---------- session actions ---------- */
function completeSession(row){
  const t=taskById(row.dataset.task);if(!t)return;const s=+row.dataset.s,e=+row.dataset.e,mins=(e-s)/MIN;const snap=snapshot();
  t.done=Math.min(t.minutes,(t.done||0)+mins);if(remainingOf(t)<=0)t.completed=true;
  state.log.push({id:uid(),taskId:t.id,title:t.title,cat:t.cat,mins,at:Date.now(),start:Math.min(s,Date.now())});
  collapse(row,()=>commit(t.completed?`${shortTitle(t.title)}: all done`:`Logged ${fmtDur(mins)} · ${fmtDur(remainingOf(t))} to go`,snap));
}
function laterSession(row){
  const t=taskById(row.dataset.task);if(!t)return;const snap=snapshot();
  t.skips=[...(t.skips||[]),[+row.dataset.s,+row.dataset.e]];
  collapse(row,()=>{plan=buildPlan(state,new Date());const nx=plan.info[t.id]?.sessions[0];commit(nx?`Moved to ${dayName(new Date(nx.start))}, ${fmtTime(new Date(nx.start))}`:'Moved, but no free time is left for it',snap)});
}
function collapse(row,cb){row.style.height=row.offsetHeight+'px';void row.offsetHeight;row.style.height='0px';row.style.opacity='0';setTimeout(cb,280)}

/* ---------- gestures ---------- */
let drag=null,suppress=false;
document.addEventListener('pointerdown',e=>{
  if((e.button&&e.button!==0)||drag)return;
  const fg=e.target.closest('.srow-fg'),sg=e.target.closest('.grab,.sh-head'),cal=e.target.closest('#swipeCal');
  if(fg&&!e.target.closest('[data-check]'))drag={k:'row',el:fg,row:fg.parentElement,x0:e.clientX,y0:e.clientY,id:e.pointerId};
  else if(sg&&!e.target.closest('button')&&!wide())drag={k:'sheet',el:$('sheet'),x0:e.clientX,y0:e.clientY,id:e.pointerId,t0:performance.now()};
  else if(cal&&!sheetOpen)drag={k:'cal',el:$('calBox'),x0:e.clientX,y0:e.clientY,id:e.pointerId,t0:performance.now()};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.lock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(drag.k==='sheet'){if(dy>0&&Math.abs(dy)>Math.abs(dx))drag.lock='y';else{drag=null;return}}
    else if(Math.abs(dx)>Math.abs(dy)*1.2)drag.lock='x';else{drag=null;return}
    if(drag.k==='row')drag.row.classList.add('drag');if(drag.k==='sheet')drag.el.classList.add('drag');if(drag.k==='cal')drag.el.style.transition='none'}
  drag.dx=dx;drag.dy=dy;
  if(drag.k==='row'){drag.el.style.transform=`translateX(${dx>0?Math.min(dx,200):Math.max(dx,-200)}px)`;drag.row.dataset.dir=dx>0?'r':'l'}
  else if(drag.k==='sheet')drag.el.style.transform=`translateY(${Math.max(0,dy)}px)`;
  else drag.el.style.transform=`translateX(${dx*.6}px)`;
},{passive:true});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;
  if(!d.lock)return;suppress=true;setTimeout(()=>suppress=false,80);
  if(d.k==='row'){d.row.classList.remove('drag');const dx=d.dx||0;
    if(dx>90){d.el.style.transform='translateX(100%)';if(navigator.vibrate)navigator.vibrate(8);setTimeout(()=>completeSession(d.row),200)}
    else if(dx<-90){d.el.style.transform='translateX(-100%)';if(navigator.vibrate)navigator.vibrate(8);setTimeout(()=>laterSession(d.row),200)}
    else{d.el.style.transform='';setTimeout(()=>delete d.row.dataset.dir,320)}}
  else if(d.k==='sheet'){d.el.classList.remove('drag');const v=(d.dy||0)/(performance.now()-d.t0);if((d.dy||0)>120||v>.6)closeSheet();else d.el.style.transform=''}
  else{const dx=d.dx||0,v=Math.abs(dx)/(performance.now()-d.t0);if(Math.abs(dx)>70||v>.5)slide(dx<0?1:-1);else{d.el.style.transition='transform .3s var(--ease)';d.el.style.transform=''}}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
function shift(dir){if(calView==='week')anchor=addDays(anchor,7*dir);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+dir,1)}
function slide(dir){
  const el=$('calBox');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){shift(dir);render();return}
  el.style.transition='transform .2s var(--ease),opacity .2s';el.style.transform=`translateX(${-dir*35}%)`;el.style.opacity='0';
  setTimeout(()=>{shift(dir);render();el.style.transition='none';el.style.transform=`translateX(${dir*35}%)`;void el.offsetWidth;el.style.transition='transform .38s var(--ease),opacity .3s';el.style.transform='';el.style.opacity=''},190);
}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(!state)return;
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const cv=e.target.closest('[data-cv]');if(cv){if(calView!==cv.dataset.cv){calView=cv.dataset.cv;saveUI();render()}return}
  if(e.target.closest('#sheet'))return;
  const ck=e.target.closest('[data-check]');if(ck){ck.classList.add('on');if(navigator.vibrate)navigator.vibrate(8);const row=ck.closest('.srow');setTimeout(()=>completeSession(row),280);return}
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='clearEx')clearExamples();if(a.dataset.act==='settings')openSettings();return}
  const op=e.target.closest('[data-open]');if(op){const[k,id]=op.dataset.open.split(':');k==='ev'?openEvent(id):openTask(id);return}
  const j=e.target.closest('[data-jump]');if(j){const el=$('wd-'+j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const sd=e.target.closest('[data-sel]');if(sd){if(wide()){if(e.target.closest('.mo-n')){anchor=parseYMD(sd.dataset.sel);calView='week';saveUI();render()}}else selectDay(sd.dataset.sel);return}
  const col=e.target.closest('.wk-c');if(col&&e.target===col){const r=col.getBoundingClientRect(),y=(e.clientY-r.top)/r.height,rs=+col.dataset.rs,re=+col.dataset.re,mm=Math.round((rs+y*(re-rs))/30)*30,st=setMin(parseYMD(col.dataset.day),mm);
    openEvent(null,{title:'',type:'rehearsal',allDay:false,start:localStr(st),end:localStr(new Date(st.getTime()+60*MIN)),repeat:'none',until:'',busy:true,notes:''})}
});
$('addBtn').onclick=()=>state&&openQuick();
$('todayBtn').onclick=()=>{const was=ymd(startOfWeek(anchor));anchor=startOfDay(new Date());selDay=ymd(anchor);if(was!==ymd(startOfWeek(anchor))||calView==='month')render();if(!wide()&&calView==='week'){const el=$('wd-'+ymd(new Date()));if(el)el.scrollIntoView({behavior:'smooth'})}};
$('prevBtn').onclick=()=>slide(-1);$('nextBtn').onclick=()=>slide(1);
document.addEventListener('keydown',e=>{if(sheetOpen||!state||e.target.closest('input,textarea,select'))return;
  if(e.key==='ArrowLeft'&&tab==='cal')slide(-1);else if(e.key==='ArrowRight'&&tab==='cal')slide(1);else if(e.key==='n'){e.preventDefault();openQuick()}});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>state&&!sheetOpen&&render(),150)});
setInterval(()=>{if(state&&!sheetOpen&&!drag)render()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&!sheetOpen)render()});

/* ---------- start ---------- */
if(mode==='cloud')startCloud();
else{let s=null;try{s=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  state=normalize(s||exampleState());if(!s)persist();else setSync('local');render({enter:true})}
})();
</script>
