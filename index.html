<!doctype html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chereography">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
</head>
<body>
<title>Chereography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app shell. Large-title nav bar, one scrolling pane per tab (Calendar / Plan / Insights), bottom tab bar on phones that moves into the nav bar as a pill on wide screens. Wide Calendar tab adds a "Today" column. Sheets slide up from the bottom (centered cards on wide screens). */
:root{
  --bg:#FFFFFF; --card:#F2F2F7; --sheet:#F2F2F7; --row:#FFFFFF; --thumb:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2); --sep:rgba(60,60,67,.16);
  --label:#1C1C1E; --label-2:#6C6C70; --label-3:#A1A1A6;
  --g1:#EDC6B7; --g2:#D09592; --g3:#B76E79;
  --accent:#B76E79; --accent-text:#A15A65; --accent-soft:rgba(183,110,121,.13);
  --k-rose:#B76E79; --k-red:#FF3B30; --k-orange:#FF9500; --k-yellow:#D9A400; --k-green:#34C759; --k-teal:#1FA2B6;
  --k-blue:#007AFF; --k-indigo:#5856D6; --k-purple:#AF52DE; --k-pink:#FF2D55; --k-brown:#A2845E; --k-gray:#8E8E93;
  --ok:#34C759; --warn:#FF9500; --bad:#FF3B30; --ok-text:#248A3D; --warn-text:#C26A00;
  --bar:rgba(255,255,255,.86); --scrim:rgba(0,0,0,.28); --shadow:0 12px 40px rgba(0,0,0,.14);
  --grad2:linear-gradient(140deg,#CF9195 0%,#B76E79 55%,#9C5562 100%);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --gutL:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1C1E; --card:#2C2C2E; --sheet:#2C2C2E; --row:#3A3A3C; --thumb:#636366;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36); --sep:rgba(84,84,88,.6);
  --label:#F5F5F7; --label-2:#AEAEB2; --label-3:#6E6E73;
  --g1:#F5D6C8; --g2:#E3A89F; --g3:#C98890;
  --accent:#E0A49C; --accent-text:#EBB5AD; --accent-soft:rgba(224,164,156,.17);
  --k-rose:#E0A49C; --k-red:#FF453A; --k-orange:#FF9F0A; --k-yellow:#FFD60A; --k-green:#30D158; --k-teal:#40C8E0;
  --k-blue:#0A84FF; --k-indigo:#7D7AFF; --k-purple:#BF5AF2; --k-pink:#FF375F; --k-brown:#AC8E68; --k-gray:#98989D;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A; --ok-text:#30D158; --warn-text:#FF9F0A;
  --bar:rgba(28,28,30,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.5);
  --grad2:linear-gradient(140deg,#C98890 0%,#A86470 55%,#8A4F5C 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --card:#2C2C2E; --sheet:#2C2C2E; --row:#3A3A3C; --thumb:#636366;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36); --sep:rgba(84,84,88,.6);
  --label:#F5F5F7; --label-2:#AEAEB2; --label-3:#6E6E73;
  --g1:#F5D6C8; --g2:#E3A89F; --g3:#C98890;
  --accent:#E0A49C; --accent-text:#EBB5AD; --accent-soft:rgba(224,164,156,.17);
  --k-rose:#E0A49C; --k-red:#FF453A; --k-orange:#FF9F0A; --k-yellow:#FFD60A; --k-green:#30D158; --k-teal:#40C8E0;
  --k-blue:#0A84FF; --k-indigo:#7D7AFF; --k-purple:#BF5AF2; --k-pink:#FF375F; --k-brown:#AC8E68; --k-gray:#98989D;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A; --ok-text:#30D158; --warn-text:#FF9F0A;
  --bar:rgba(28,28,30,.86); --scrim:rgba(0,0,0,.55); --shadow:0 12px 40px rgba(0,0,0,.5);
  --grad2:linear-gradient(140deg,#C98890 0%,#A86470 55%,#8A4F5C 100%); color-scheme:dark}
:root{--grad:linear-gradient(135deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--label);font:15px/1.35 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.k-rose{--c:var(--k-rose)} .k-red{--c:var(--k-red)} .k-orange{--c:var(--k-orange)} .k-yellow{--c:var(--k-yellow)} .k-green{--c:var(--k-green)} .k-teal{--c:var(--k-teal)}
.k-blue{--c:var(--k-blue)} .k-indigo{--c:var(--k-indigo)} .k-purple{--c:var(--k-purple)} .k-pink{--c:var(--k-pink)} .k-brown{--c:var(--k-brown)} .k-gray{--c:var(--k-gray)}
.c-dance{--c:var(--accent)} .c-work{--c:var(--k-teal)} .c-other{--c:var(--k-blue)}

/* Shell */
.app{height:100%;display:flex;flex-direction:column;position:relative}
.nav{flex:none;padding:calc(6px + env(safe-area-inset-top,0px)) var(--gutR) 0 var(--gutL);position:relative;z-index:5;background:var(--bg)}
.nav-row{display:flex;align-items:center;gap:6px;height:44px}
.nav-row .grow{flex:1}
.txtbtn{color:var(--accent-text);font-size:17px;padding:8px 2px;white-space:nowrap}
.txtbtn.strong{font-weight:600}
.txtbtn:disabled{color:var(--label-3);cursor:default}
.icbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent-text);flex:none}
.icbtn:hover{background:var(--fill)}
.addbtn{width:36px;height:36px;border-radius:50%;background:var(--grad2);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px color-mix(in srgb,var(--g3) 40%,transparent);flex:none;transition:transform .2s var(--ease)}
.addbtn:active{transform:scale(.9)}
.titles{padding:2px 0 10px}
.ltitle{margin:0;font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.12;text-wrap:balance}
.ltitle .yr{color:var(--label-3);font-weight:600}
.lsub{margin:2px 0 0;color:var(--label-2);font-size:15px}
.segc.toptabs{display:none}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 var(--gutR) 28px var(--gutL)}
.tabbar{flex:none;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px var(--gutR) calc(4px + env(safe-area-inset-bottom,0px)) var(--gutL);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--label-3);padding:3px 0 2px}
.tab svg{width:26px;height:24px;transition:transform .2s var(--ease)}
.tab[aria-selected="true"]{color:var(--accent-text)}
.tab:active svg{transform:scale(.88)}
.pane{display:none}
.pane.on{display:block}
.pane.enter .stg{animation:rise .42s var(--ease) both;animation-delay:calc(min(var(--i,0),14) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Segmented control */
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;position:relative}
.segc button{height:30px;border-radius:7px;font-size:13px;font-weight:500;position:relative;z-index:1;color:var(--label)}
.segc button[aria-pressed="true"]{font-weight:600}
.segc .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .32s var(--ease)}

/* Groups & rows */
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 4px 8px}
.ghead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ghead span{color:var(--label-2);font-size:13px;text-align:right}
@media (hover:hover) and (pointer:fine){.touchonly{display:none}}
.gfoot{margin:8px 16px 0;font-size:13px;color:var(--label-2);line-height:1.4}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;text-align:left}
.group>.row+.row::before,.group>.srow+.srow .srow-fg::before,.group>.row+.srow .srow-fg::before,.group>.srow+.row::before,.group>.drow+.drow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-size:16px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.row .s{font-size:13px;color:var(--label-2);overflow-wrap:anywhere;line-height:1.35}
.row .end{color:var(--label-2);font-size:14px;white-space:nowrap}
.chev{color:var(--label-3);flex:none}
.bar3{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.tcol{width:56px;flex:none;display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.tcol b{font-weight:600;color:var(--label)}
.tcol span{color:var(--label-3)}
.empty{color:var(--label-2);font-size:15px;padding:14px 16px;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.p-ok{color:var(--ok-text);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.p-tight{color:var(--warn-text);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.p-short,.p-late{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.p-any{color:var(--label-2);background:var(--fill)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* Swipeable session rows */
.srow{position:relative;overflow:hidden;transition:height .28s var(--ease),opacity .28s}
.srow-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-weight:600;font-size:15px}
.srow[data-dir="r"] .srow-bg{background:var(--ok)}
.srow[data-dir="l"] .srow-bg{background:#8E8E93}
.srow-bg span{opacity:0}
.srow[data-dir="r"] .srow-bg .bl,.srow[data-dir="l"] .srow-bg .br{opacity:1}
.srow-fg{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 16px;background:var(--card);touch-action:pan-y;transition:transform .32s var(--ease)}
.srow.drag .srow-fg{transition:none}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--label-3);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s,transform .25s var(--ease)}
.check svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.check:hover{border-color:var(--accent)}
.check.on{border-color:transparent;background:var(--grad2);transform:scale(1.1)}
.check.on svg{opacity:1;transform:none}
.srow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.srow .t{font-size:16px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.srow .s{font-size:13px;color:var(--label-2)}
.kick{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.srow.c-work .kick{color:var(--k-teal)} .srow.c-other .kick{color:var(--k-blue)}
.pin{display:inline-block;margin-left:6px;color:var(--label-3);vertical-align:-1px}

/* Hero (Plan) */
.hero{position:relative;border-radius:20px;padding:18px;overflow:hidden;color:#fff;background:var(--grad2);display:flex;gap:16px;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 100% 0%,rgba(255,225,210,.32),transparent 60%);pointer-events:none}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;text-shadow:0 1px 2px rgba(80,30,40,.18)}
.hero p{margin:4px 0 0;font-size:14px;opacity:.95}
.banner{border-radius:14px;background:var(--accent-soft);padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.banner p{margin:0;font-size:14px;line-height:1.4}
.banner button{align-self:flex-start;color:var(--accent-text);font-weight:600;font-size:15px}
.dayline{font-size:12px;font-weight:600;color:var(--label-2);padding:12px 16px 2px;text-transform:uppercase;letter-spacing:.03em}

/* Calendar */
.calhead{margin:0 0 12px}
.calhead .segc{max-width:240px}
.swipe-cal{touch-action:pan-y;overflow:hidden}
.calbox{will-change:transform}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:0 -4px 2px}
.dp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px;border-radius:12px}
.dp:active{background:var(--fill)}
.dp .dw{font-size:11px;font-weight:600;color:var(--label-3)}
.dp .dn{font-size:19px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.dp.today .dn{background:var(--grad2);color:#fff}
.dp.today .dw{color:var(--accent-text)}
.dp .load{width:26px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;display:flex}
.dp .load i{display:block;height:100%}
.dp .load .b{background:var(--label-3)} .dp .load .p{background:var(--accent)}
.wday{scroll-margin-top:8px}
.wday .dh{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.wday .dh b{font-size:17px;font-weight:700}
.wday .dh span{font-size:13px;color:var(--label-2)}
.wday.today .dh b{color:var(--accent-text)}
.sessrow .bar3{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.sessrow .s{color:var(--accent-text)}
.sessrow.c-work .s{color:var(--k-teal)}

/* Week grid (wide) */
.wk{display:none}
.wkg{display:flex;flex-direction:column;height:100%;background:var(--bg);border-radius:12px;border:.5px solid var(--sep);overflow:hidden}
.wk-r{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr))}
.wk-h{border-bottom:.5px solid var(--sep)}
.wk-dh{padding:8px;display:flex;align-items:center;gap:6px;border-left:.5px solid var(--sep)}
.wk-dh .dw{font-size:12px;font-weight:600;color:var(--label-2)}
.wk-dh .dn{font-size:18px;font-weight:600;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;border-radius:14px}
.wk-dh.today .dn{background:var(--grad2);color:#fff}
.wk-dh.today .dw{color:var(--accent-text)}
.wk-a{border-bottom:.5px solid var(--sep)}
.wk-a .lab{font-size:11px;color:var(--label-3);padding:5px 8px 0 0;text-align:right}
.wk-ac{border-left:.5px solid var(--sep);padding:3px;display:flex;flex-direction:column;gap:2px;min-height:26px}
.wk-b{flex:1;min-height:0;display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));position:relative}
.wk-ax{position:relative}
.wk-ax span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--label-3);white-space:nowrap}
.wk-ax span:first-child{transform:none}
.wk-c{position:relative;border-left:.5px solid var(--sep);background-image:linear-gradient(to bottom,var(--sep) 0 .5px,transparent .5px);background-size:100% calc(100% / var(--hours))}
.wk-c.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.prz{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--accent) 6%,transparent);border-top:1px dashed color-mix(in srgb,var(--accent) 30%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--accent) 30%,transparent);pointer-events:none}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;left:calc(var(--l) * 1% + 2px);width:calc(var(--w) * 1% - 4px);top:calc(var(--t) * 1%);height:calc(var(--h) * 1% - 2px);min-height:18px;border-radius:5px;padding:3px 6px 3px 7px;overflow:hidden;font-size:12px;line-height:1.25;text-align:left;z-index:2;
  background:color-mix(in srgb,var(--c) 20%,var(--bg));border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 42%,var(--label));transition:box-shadow .2s}
.blk:hover{z-index:6;box-shadow:var(--shadow)}
.blk b{display:block;font-weight:600;overflow-wrap:anywhere}
.blk .tm{display:block;opacity:.85;font-size:11px}
.blk.free{background:var(--bg);border:1px dotted var(--c);border-left:3px solid var(--c)}
.blk.sess{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 17%,transparent) 0 5px,transparent 5px 10px),var(--bg);border:1.5px dashed var(--c)}
.blk.sess .kick{font-size:9.5px;display:block;color:inherit;opacity:.85}
.chipev{display:block;width:100%;text-align:left;font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,var(--bg));color:color-mix(in srgb,var(--c) 42%,var(--label));overflow-wrap:anywhere}

/* Month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-dw{font-size:11px;font-weight:600;color:var(--label-3);text-align:center;padding:0 0 6px}
.mo-c{min-height:56px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:.5px solid var(--sep);min-width:0;cursor:pointer}
.mo-n{font-size:17px;font-weight:500;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:background .2s}
.mo-c.out .mo-n{color:var(--label-3)}
.mo-c.today .mo-n{color:var(--accent-text);font-weight:700}
.mo-c.sel .mo-n{background:var(--label);color:var(--bg);font-weight:700}
.mo-c.sel.today .mo-n{background:var(--grad2);color:#fff}
.mo-bars{display:flex;flex-direction:column;gap:2px;width:72%}
.mo-bars i{display:block;height:3px;border-radius:2px;background:var(--c)}
.mo-bars i.s{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 6px)}
.mo-more{font-size:10px;color:var(--label-3);line-height:1}
.mo-list{display:none}
.mo-it{display:none}

/* Insights */
.verdict{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict .vk{font-size:13px;font-weight:600;color:var(--label-2)}
.verdict h3{margin:0;font-size:30px;font-weight:700;letter-spacing:-.022em;line-height:1.1;color:var(--vc)}
.verdict p{margin:2px 0 0;font-size:15px;line-height:1.45}
.v-ok{--vc:var(--ok-text);--vb:var(--ok)} .v-mid{--vc:var(--accent-text);--vb:var(--accent)} .v-tight{--vc:var(--warn-text);--vb:var(--warn)} .v-over{--vc:var(--bad);--vb:var(--bad)}
.capbar{height:10px;border-radius:5px;background:var(--fill-2);overflow:hidden;margin-top:10px}
.capbar i{display:block;height:100%;border-radius:5px;background:var(--vb);transform-origin:left;animation:growx .9s var(--ease) both}
.caplab{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--label-2)}

}
function statusPill(t){const inf=plan.info[t.id];if(t.completed||remainingOf(t)<=0)return'<span class="pill p-ok">Done</span>';const st=inf?inf.status:'any';return`<span class="pill p-${st}">${{ok:'On track',tight:'Start soon',short:'Short on time',late:'Overdue',any:'Anytime'}[st]}</span>`}
function taskRow(t,i){
  const inf=plan.info[t.id];const done=t.completed||remainingOf(t)<=0;

function planHTML(compact){

  const sod=startOfDay(now),eod=addDays(sod,1);

  const rows=items.map(x=>x.kind==='sess'?sessRow(x.s,i++):agendaRow(x.allDay?{it:x}:{it:x,s:Math.max(x.start.getTime(),sod.getTime()),e:Math.min(x.end.getTime(),eod.getTime()),cont:x.start<sod,contEnd:x.end>eod},i++));

/* ---------- insights ---------- */
function insightsHTML(){
  const now=new Date(),N=now.getTime(),S=settingsOf(state);
  const sod=startOfDay(now),days=[...Array(7)].map((_,i)=>addDays(sod,i)),H7=addDays(sod,7).getTime();
  const active=state.tasks.filter(t=>!t.completed&&remainingOf(t)>0);
  const due7=active.filter(t=>{const d=deadlineOf(state,t);return d&&d.getTime()>N&&d.getTime()<=H7});
  const need=sum(due7.map(remainingOf));
  const capTotal=sum(days.map(d=>plan.cap[ymd(d)]||0));
  const shortT=active.filter(t=>['short','late'].includes(plan.info[t.id]?.status));
  let i=0,h='';

  // 1. The verdict on the next 7 days
  let word,cls,text;
  const ratio=capTotal?need/capTotal:(need?2:0);
  if(!need&&!shortT.length){word='All clear';cls='v-ok';text=`Nothing is due in the next 7 days. You have ${fmtHrs(capTotal)}h of free time, and it's all yours.`}
  else if(shortT.length||ratio>=1){word='Overbooked';cls='v-over';text=shortT.length?`${shortT.length===1?esc(shortT[0].title)+" doesn't":shortT.length+" things don't"} fit before ${shortT.length===1?'its':'their'} deadline. Free up some time or push something back.`:`You need ${fmtDur(need)} before next ${DOWL[addDays(sod,7).getDay()]} but only have ${fmtDur(capTotal)} free.`}
  else if(ratio>=.7){word='Tight';cls='v-tight';text=`You need ${fmtDur(need)} for practice and deadlines, and you have ${fmtDur(capTotal)} free. Most of your spare time is already spoken for, so think twice before saying yes to more.`}
  else if(ratio>=.35){word='Manageable';cls='v-mid';text=`You need ${fmtDur(need)} for practice and deadlines, and you have ${fmtDur(capTotal)} free. There's room, as long as you stick to the plan.`}
  else{word='Plenty of room';cls='v-ok';text=`You need ${fmtDur(need)} for practice and deadlines, and you have ${fmtDur(capTotal)} free. Lots of breathing space this week.`}
  h+=`<div class="verdict ${cls} stg" style="--i:${i++}"><span class="vk">Next 7 days</span><h3>${word}</h3><p>${text}</p>${need?`<div class="capbar" role="img" aria-label="${fmtDur(need)} needed of ${fmtDur(capTotal)} free"><i style="width:${Math.min(100,capTotal?need/capTotal*100:100)}%"></i></div><div class="caplab"><span><b>${fmtDur(need)}</b> needed</span><span><b>${fmtDur(capTotal)}</b> free</span></div>`:''}</div>`;

  // 2. Day by day: how full each day is
  const rowsD=days.map(d=>{const k=ymd(d);const[a,b]=dayBounds(S,d);const span=(b-a)/MIN;
    const planned=sum(plan.sessions.filter(s=>s.start<b&&s.end>a).map(s=>(Math.min(s.end,b)-Math.max(s.start,a))/MIN));
    const free=Math.max(0,(plan.cap[k]||0)-sum(plan.sessions.filter(s=>s.start<b&&s.end>Math.max(a,N)).map(s=>(Math.min(s.end,b)-Math.max(s.start,a,N))/MIN)));
    const taken=Math.max(0,span-free-planned);
    const over=k===ymd(now)&&b-Math.max(a,N)<60*MIN;
    const lv=over?'done':free<60?'packed':free<180?'busy':(taken<30&&!planned)?'free':'light';
    return{d,k,span,planned,free,taken,lv}});
  h+=`<div class="ghead"><h2>Day by day</h2><span>between ${fmtTime(setMin(sod,toMin(S.dayStart)))} and ${fmtTime(setMin(sod,toMin(S.dayEnd)||1439))}</span></div><div class="group stg" style="--i:${i++}">`;
  rowsD.forEach((r,j)=>{const isT=j===0;
    h+=`<button class="drow${isT?' today':''}" data-goto="${r.k}"><span class="dl"><b>${isT?'Today':DOW[r.d.getDay()]}</b><span>${r.d.getDate()} ${MON[r.d.getMonth()]}</span></span><span class="dbar"><i class="b" style="width:${r.taken/r.span*100}%;animation-delay:${j*40}ms"></i><i class="p" style="width:${r.planned/r.span*100}%;animation-delay:${j*40}ms"></i></span><span class="dr"><b class="lv-${r.lv}">${{done:"Day's done",packed:'Packed',busy:'Busy',light:'Light',free:'Free'}[r.lv]}</b>${r.lv==='done'?'':`<span>${fmtDur(Math.round(r.free/15)*15)} free</span>`}</span></button>`});
  h+=`<div class="legend"><span><i style="background:var(--label-3)"></i>Booked or gone</span><span><i style="background:var(--grad2)"></i>Practice & work</span><span><i style="background:var(--fill);outline:1px solid var(--fill-2)"></i>Free</span></div></div>`;
  const bestDay=rowsD.slice(rowsD[0].free>=120?0:1).sort((a,b)=>b.free-a.free)[0];
  const packed=rowsD.filter(r=>r.lv==='packed');
  const dline=[];
  if(bestDay&&bestDay.free>=120)dline.push(`${bestDay===rowsD[0]?'Today':DOWL[bestDay.d.getDay()]} has the most free time (${fmtDur(Math.round(bestDay.free/15)*15)}). Best day to get ahead or rest.`);
  const pn=packed.map(r=>r===rowsD[0]?'today':DOWL[r.d.getDay()]);
  if(pn.length)dline.push(`${cap1(pn.length>1?pn.slice(0,-1).join(', ')+' and '+pn[pn.length-1]:pn[0])} ${pn.length===1?'is':'are'} fully booked, so nothing extra goes there.`);
  if(dline.length)h+=`<p class="gfoot">${dline.join(' ')}</p>`;

  // 3. Readiness for rehearsals and shows
  const ready=state.tasks.filter(t=>t.auto&&t.dueType==='event').map(t=>({t,ev:state.events.find(e=>e.id===t.eventId)})).filter(x=>x.ev).map(x=>({...x,d:evStart(x.ev)})).filter(x=>x.d>now&&x.d<addDays(now,21)).sort((a,b)=>a.d-b.d);
  if(ready.length){
    h+=`<div class="ghead"><h2>Are you ready?</h2><span>next 3 weeks</span></div><div class="group">`;
    ready.forEach(({t,ev,d})=>{const inf=plan.info[t.id]||{sessions:[]},left=remainingOf(t),done=Math.min(t.done||0,t.minutes);let pill,msg;
      const nx=inf.sessions&&inf.sessions[0];
      if(t.completed||left<=0){pill='<span class="pill p-ok">Ready</span>';msg=`All ${fmtDur(t.minutes)} practised. You're set.`}
      else if(inf.status==='short'){pill='<span class="pill p-short">Not enough time</span>';msg=`Only ${fmtDur(Math.max(0,left-inf.shortfall))} of free practice time before it, so you're ${fmtDur(inf.shortfall)} short. Free up an evening, widen your practice hours, or lower the practice amount.`}
      else if(inf.status==='tight'){pill='<span class="pill p-tight">Start now</span>';msg=`${fmtDur(left)} still to go with little time left.${nx?` Next: ${slotLabel(nx.start)}.`:''}`}
      else{pill='<span class="pill p-ok">On track</span>';msg=`${done?fmtDur(done)+' done, ':''}${fmtDur(left)} to go.${nx?` ${inf.sessions.length} ${inf.sessions.length===1?'session':'sessions'} booked, next ${slotLabel(nx.start)}.`:''}`}
      h+=`<button class="row stg" style="--i:${i++}" data-open="ev:${ev.id}"><span class="main"><span class="rtop"><span class="t">${esc(ev.title)}</span>${pill}</span><span class="s">${cap1(relDay(d))} · ${fmtWhen(d)}</span><span class="prog"><i style="width:${t.minutes?Math.min(100,done/t.minutes*100):0}%"></i></span><span class="s" style="color:var(--label)">${esc(msg)}</span></span></button>`});
    h+=`</div>`;
  }

  // 4. Deadlines and when to start
  const dls=active.filter(t=>!t.auto).map(t=>({t,d:deadlineOf(state,t)})).filter(x=>x.d&&x.d<addDays(now,14)).sort((a,b)=>a.d-b.d);
  if(dls.length){
    h+=`<div class="ghead"><h2>Deadlines</h2><span>next 2 weeks</span></div><div class="group">`;
    dls.forEach(({t,d})=>{const inf=plan.info[t.id]||{};let msg;
      if(inf.status==='late')msg=`Was due ${fmtWhen(d)}. Mark it done or change the date.`;
      else if(inf.status==='short')msg=`Due ${fmtWhen(d)}. Only ${fmtDur(Math.max(0,remainingOf(t)-inf.shortfall))} of free time before then.`;
      else msg=`Due ${fmtWhen(d)}.${inf.lastChance?` Start by ${slotLabel(inf.lastChance)} at the latest.`:''}`;
      h+=`<button class="row stg c-${t.cat}" style="--i:${i++}" data-open="task:${t.id}"><span class="main"><span class="rtop"><span class="t">${esc(t.title)}</span>${statusPill(t)}</span><span class="s">${fmtDur(remainingOf(t))} of work · ${esc(msg)}</span></span></button>`});

  const pThis=sum(log.filter(l=>l.cat==='dance'&&l.at>=ws).map(l=>l.mins)),pLast=sum(log.filter(l=>l.cat==='dance'&&l.at>=lw&&l.at<ws).map(l=>l.mins));
  const daysThis=new Set(log.filter(l=>l.cat==='dance'&&l.at>=ws).map(l=>ymd(new Date(l.at)))).size;
  const wThis=sum(log.filter(l=>l.cat!=='dance'&&l.at>=ws).map(l=>l.mins));
  let back;
  if(!pThis&&!pLast)back=`No practice logged yet. Tick sessions off as you finish them and your progress shows up here.`;
  else{const diff=pThis-pLast;back=`You've practised ${fmtDur(pThis)} this week${daysThis?` over ${daysThis} ${daysThis===1?'day':'days'}`:''}. `+(pLast?(diff>=0?`That's ${diff?fmtDur(diff)+' more than':'the same as'} last week.`:`Last week you did ${fmtDur(pLast)}, so ${fmtDur(-diff)} to go to match it.`):'')}
  const mx=Math.max(pThis,pLast,1);
  h+=`<div class="ghead"><h2>Looking back</h2><span>practice</span></div><div class="group stg" style="--i:${i++};padding:12px 0 10px"><p style="margin:0 16px 10px;font-size:15px;line-height:1.42">${esc(back)}${wThis?` Plus ${fmtDur(wThis)} of work done.`:''}</p><div class="cmp"><span>This week</span><span class="tr"><i style="width:${pThis/mx*100}%"></i></span><b>${fmtDur(pThis)}</b></div><div class="cmp" style="margin-top:6px"><span>Last week</span><span class="tr"><i class="ls" style="width:${pLast/mx*100}%"></i></span><b>${fmtDur(pLast)}</b></div></div>`;

  // 6. Heads-up tips

  return h;
}

/* ---------- persistence ---------- */
function normalize(s){
  s=s&&typeof s==='object'?s:{};
  const st={version:3,settings:{...DEFAULTS,...(s.settings||{})},events:Array.isArray(s.events)?s.events:[],tasks:Array.isArray(s.tasks)?s.tasks:[],log:Array.isArray(s.log)?s.log:[]};
  if(!st.settings.v){if(st.settings.dayStart==='08:00'&&st.settings.dayEnd==='22:30'){st.settings.dayStart=DEFAULTS.dayStart;st.settings.dayEnd=DEFAULTS.dayEnd}delete st.settings.practiceAt;st.settings.v=3}
  if(!Array.isArray(st.settings.types)||!st.settings.types.length)st.settings.types=JSON.parse(JSON.stringify(DEFAULT_TYPES));
  return tidy(st);
}
const snapshot=()=>JSON.stringify(state);
let syncState='local';

let fb=null,docRef=null,unsub=null,saveTimer=null,dirty=false,lastJSON='',pending=false;

/* Session sheet: move, skip or finish one planned session */
function altSlots(t,len){
  const now=Date.now(),dl=deadlineOf(state,t),end=dl?dl.getTime():now+14*DAY,S=settingsOf(state);
  let segs=plan.free.map(f=>[Math.max(f.s,now),Math.min(f.e,end)]).filter(x=>x[1]-x[0]>=len*MIN);
  if(t.cat==='dance')segs=intersect(segs,plan.prac).filter(x=>x[1]-x[0]>=len*MIN);
  segs.sort((a,b)=>a[0]-b[0]);
  const out=[],seen=new Set();
  for(const[s,e]of segs){const day=startOfDay(new Date(s)),k=ymd(day);if(seen.has(k))continue;
    let st=s;
    if(t.cat==='dance'){const[pa,pb]=pracWindow(S,day);const P=setMin(day,Math.max(0,Math.min(Math.max(plan.prefMin,pa),pb-len))).getTime();st=Math.min(Math.max(P,s),e-len*MIN)}
    st=Math.ceil(st/(15*MIN))*15*MIN;if(st+len*MIN>e)continue;
    out.push([st,st+len*MIN]);seen.add(k);if(out.length>=6)break}
  return out;
}

/* ---------- gestures ---------- */
let drag=null,suppress=false;
document.addEventListener('pointerdown',e=>{
  if((e.button&&e.button!==0)||drag)return;
  const fg=e.target.closest('.srow-fg'),sg=e.target.closest('.grab,.sh-head'),cal=e.target.closest('#swipeCal');
  if(fg&&!e.target.closest('[data-check]'))drag={k:'row',el:fg,row:fg.parentElement,x0:e.clientX,y0:e.clientY,id:e.pointerId};
  else if(sg&&!e.target.closest('button')&&!wide())drag={k:'sheet',el:$('sheet'),x0:e.clientX,y0:e.clientY,id:e.pointerId,t0:performance.now()};
  else if(cal&&!sheetOpen)drag={k:'cal',el:$('calBox'),x0:e.clientX,y0:e.clientY,id:e.pointerId,t0:performance.now()};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.lock){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(drag.k==='sheet'){if(dy>0&&Math.abs(dy)>Math.abs(dx))drag.lock='y';else{drag=null;return}}
    else if(Math.abs(dx)>Math.abs(dy)*1.2)drag.lock='x';else{drag=null;return}
    if(drag.k==='row')drag.row.classList.add('drag');if(drag.k==='sheet')drag.el.classList.add('drag');if(drag.k==='cal')drag.el.style.transition='none'}
  drag.dx=dx;drag.dy=dy;
  if(drag.k==='row'){drag.el.style.transform=`translateX(${dx>0?Math.min(dx,200):Math.max(dx,-200)}px)`;drag.row.dataset.dir=dx>0?'r':'l'}
  else if(drag.k==='sheet')drag.el.style.transform=`translateY(${Math.max(0,dy)}px)`;
  else drag.el.style.transform=`translateX(${dx*.6}px)`;
},{passive:true});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;
  if(!d.lock)return;suppress=true;setTimeout(()=>suppress=false,80);
  if(d.k==='row'){d.row.classList.remove('drag');const dx=d.dx||0;
    if(dx>90){d.el.style.transform='translateX(100%)';if(navigator.vibrate)navigator.vibrate(8);setTimeout(()=>rowDone(d.row),200)}
    else if(dx<-90){d.el.style.transform='translateX(-100%)';if(navigator.vibrate)navigator.vibrate(8);setTimeout(()=>rowSkip(d.row),200)}
    else{d.el.style.transform='';setTimeout(()=>delete d.row.dataset.dir,320)}}
  else if(d.k==='sheet'){d.el.classList.remove('drag');const v=(d.dy||0)/(performance.now()-d.t0);if((d.dy||0)>120||v>.6)closeSheet();else d.el.style.transform=''}
  else{const dx=d.dx||0,v=Math.abs(dx)/(performance.now()-d.t0);if(Math.abs(dx)>70||v>.5)slide(dx<0?1:-1);else{d.el.style.transition='transform .3s var(--ease)';d.el.style.transform=''}}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('click',e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
function shift(dir){if(calView==='week')anchor=addDays(anchor,7*dir);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+dir,1)}
function slide(dir){
  const el=$('calBox');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){shift(dir);render();return}
  el.style.transition='transform .2s var(--ease),opacity .2s';el.style.transform=`translateX(${-dir*35}%)`;el.style.opacity='0';
  setTimeout(()=>{shift(dir);render();el.style.transition='none';el.style.transform=`translateX(${dir*35}%)`;void el.offsetWidth;el.style.transition='transform .38s var(--ease),opacity .3s';el.style.transform='';el.style.opacity=''},190);
}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(!state)return;
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const cv=e.target.closest('[data-cv]');if(cv){if(calView!==cv.dataset.cv){calView=cv.dataset.cv;saveUI();render()}return}
  if(e.target.closest('#sheet'))return;
  const ck=e.target.closest('[data-check]');if(ck){ck.classList.add('on');if(navigator.vibrate)navigator.vibrate(8);const row=ck.closest('.srow');setTimeout(()=>rowDone(row),280);return}
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='clearEx')clearExamples();return}
  const op=e.target.closest('[data-open]');if(op){const[k,id,s,en]=op.dataset.open.split(':');if(k==='ev')openEvent(id);else if(k==='sess')openSession(id,+s,+en);else openTask(id);return}
  const g=e.target.closest('[data-goto]');if(g){anchor=parseYMD(g.dataset.goto);calView='week';tab='cal';saveUI();$('content').scrollTop=0;render();if(!wide()){const el=$('wd-'+g.dataset.goto);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60)}return}
  const j=e.target.closest('[data-jump]');if(j){const el=$('wd-'+j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const sd=e.target.closest('[data-sel]');if(sd){if(wide()){if(e.target.closest('.mo-n')){anchor=parseYMD(sd.dataset.sel);calView='week';saveUI();render()}}else selectDay(sd.dataset.sel);return}
  const col=e.target.closest('.wk-c');if(col&&(e.target===col||e.target.classList.contains('prz'))){const r=col.getBoundingClientRect(),y=(e.clientY-r.top)/r.height,rs=+col.dataset.rs,re=+col.dataset.re,mm=Math.round((rs+y*(re-rs))/30)*30,st=setMin(parseYMD(col.dataset.day),mm);
    openEvent(null,{title:'',type:typesOf(state)[0].id,allDay:false,start:localStr(st),end:localStr(new Date(st.getTime()+60*MIN)),repeat:'none',until:'',busy:true,notes:''})}
});
$('addBtn').onclick=()=>state&&openQuick();
$('gearBtn').onclick=()=>state&&openSettings();
$('todayBtn').onclick=()=>{const was=ymd(startOfWeek(anchor));anchor=startOfDay(new Date());selDay=ymd(anchor);if(was!==ymd(startOfWeek(anchor))||calView==='month')render();if(!wide()&&calView==='week'){const el=$('wd-'+ymd(new Date()));if(el)el.scrollIntoView({behavior:'smooth'})}};
$('prevBtn').onclick=()=>slide(-1);$('nextBtn').onclick=()=>slide(1);
document.addEventListener('keydown',e=>{if(sheetOpen||!state||e.target.closest('input,textarea,select'))return;
  if(e.key==='ArrowLeft'&&tab==='cal')slide(-1);else if(e.key==='ArrowRight'&&tab==='cal')slide(1);else if(e.key==='n'){e.preventDefault();openQuick()}});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>state&&!sheetOpen&&render(),150)});
setInterval(()=>{if(state&&!sheetOpen&&!drag)render()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&!sheetOpen)render()});

/* ---------- start ---------- */
if(mode==='cloud')startCloud();
else{let s=null;try{s=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  state=normalize(s||exampleState());if(!s)persist();else setSync('local');render({enter:true})}
})();
</script>

</body>
</html>
